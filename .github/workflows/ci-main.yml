name: OpenCTI CI
on:
  workflow_dispatch:
  #push:
  pull_request_target:
    types: [opened, synchronize, reopened]


jobs:
  print-info:
    name: print-info
    runs-on: ubuntu-latest

    steps:

    - name: Runner information
      continue-on-error: true
      run: |
        echo -e "github.sha ${{ github.sha }}"
        echo -e "github.base_ref ${{ github.base_ref }}"
        echo -e "github.head_ref ${{ github.head_ref }}"
        echo -e "github.ref ${{ github.ref }}"
        echo -e "github.workflow_ref ${{ github.workflow_ref }}"
        echo -e "github.workflow_sha ${{ github.workflow_sha }}"
        env

    - name: OpenCTI checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
      
    - name: Check trigger type
      run: |
        echo "Event name: ${{ github.event_name }}"        
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          echo "Triggered by pull_request"
        elif [ "${{ github.event_name }}" == "pull_request_target" ]; then
          echo "Triggered by pull_request_target"
        fi

    - name: Get files
      run: |
        echo -e "Print content of opencti-platform/file-in-platform"        
        cat .github/workflows/file_in_workflow
        echo -e "Print content of opencti-platform/file-in-platform"        
        cat opencti-platform/file-in-platform
        

